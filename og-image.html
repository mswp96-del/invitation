<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; }
    .card {
      width: 1200px; height: 630px;
      background: linear-gradient(180deg, #f6efe2, #fbf7f0);
      border: 10px solid #fbf7f0;
      box-shadow: inset 0 0 0 2px #e2d6c3;
      display: flex; align-items: center; justify-content: center; gap: 40px;
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    }
    .text { text-align: center; }
    .label { font-family: 'Nanum Brush Script', cursive; font-size: 40px; color: #2b2622; margin-bottom: 6px; }
    .name {
      font-family: 'Nanum Brush Script', cursive; font-size: 130px; line-height: 1; margin: 6px 0 18px;
      background: linear-gradient(180deg, #f7e491, #e6c14a 35%, #c9962a 70%, #a9761d);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .sub { font-family: 'Nanum Brush Script', cursive; font-size: 38px; color: #2b2622; margin-bottom: 22px; line-height: 1.3; }
    .date {
      display: inline-flex; flex-direction: column; gap: 4px; padding: 14px 34px;
      border-top: 2px solid #d9c9ae; border-bottom: 2px solid #d9c9ae;
    }
    .date b { font-family: 'Nanum Myeongjo', serif; font-size: 40px; color: #a8763e; font-weight: 700; letter-spacing: 2px; }
    .date span { font-size: 24px; color: #7a6d5d; }
  </style>
</head>
<body>
  <div class="card">
    <svg width="230" height="250" viewBox="0 0 240 260" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="wc" x="-25%" y="-25%" width="150%" height="150%"><feTurbulence type="fractalNoise" baseFrequency="0.02 0.03" numOctaves="4" seed="9" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/></filter>
        <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3.2"/></filter>
        <g id="bloom" filter="url(#wc)">
          <circle cx="0" cy="0" r="33" fill="#f0b9c9" opacity="0.30"/>
          <g opacity="0.5" fill="#e79ab2"><circle cx="-19" cy="-6" r="13"/><circle cx="-12" cy="-21" r="13"/><circle cx="4" cy="-25" r="13"/><circle cx="19" cy="-15" r="13"/><circle cx="23" cy="3" r="13"/><circle cx="15" cy="18" r="13"/><circle cx="-2" cy="23" r="13"/><circle cx="-18" cy="15" r="13"/><circle cx="-25" cy="-1" r="12"/></g>
          <g opacity="0.52" fill="#d3688a"><circle cx="-10" cy="-7" r="11"/><circle cx="-2" cy="-15" r="11"/><circle cx="11" cy="-9" r="11"/><circle cx="13" cy="4" r="11"/><circle cx="2" cy="13" r="11"/><circle cx="-11" cy="8" r="11"/></g>
          <g opacity="0.55" fill="#b8496b"><circle cx="0" cy="-2" r="8"/><circle cx="7" cy="4" r="7"/><circle cx="-5" cy="4" r="7"/></g>
          <circle cx="-8" cy="-10" r="7" fill="#fdeef2" opacity="0.55"/><circle cx="3" cy="-6" r="5" fill="#fdeef2" opacity="0.5"/>
        </g>
      </defs>
      <g filter="url(#wc)" fill="none" stroke-linecap="round">
        <path d="M150 96 C144 150 120 200 104 250" stroke="#4f7a43" stroke-width="6" opacity="0.8"/>
        <path d="M84 126 C92 168 118 210 134 250" stroke="#3f7038" stroke-width="6" opacity="0.8"/>
      </g>
      <g filter="url(#wc)" opacity="0.78">
        <path d="M132 168 C108 176 92 196 86 220 C110 214 128 196 134 172 Z" fill="#5a8a49"/>
        <path d="M116 150 C138 156 156 176 160 198 C138 194 120 178 114 154 Z" fill="#4f8040"/>
      </g>
      <use href="#bloom" transform="translate(154,62) scale(1.08)"/>
      <use href="#bloom" transform="translate(82,100) scale(0.9)"/>
    </svg>
    <div class="text">
      <div class="label">고운 예순, 점심 자리에 모십니다</div>
      <div class="name">원정숙 님</div>
      <div class="sub">예순 번의 계절이 무르익어<br>고운 날을 맞았습니다</div>
      <div class="date"><b>2026. 10. 26.</b><span>일요일 낮 12시 · 하루일식</span></div>
    </div>
  </div>
</body>
</html>
